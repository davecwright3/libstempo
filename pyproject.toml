# to create a new release, do the following:
# install the build and twine packages
# $ pip install build twine
# create a git tag with the new version number, e.g.,
# $ git tag -a v3.5.0 -m "Version 3.5.0"
# build the source distribution
# $ python -m build --sdist --outdir .
# Upload to PyPI with:
# $ twine upload --repository libstempo libstempo-*.tar.gz

[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.2",
    "wheel", # ephem package likes to have wheel installed
    "cython",
    'numpy>=2.0.0; python_version > "3.8"',
    'numpy<2.0; python_version == "3.8"',
]
build-backend = "setuptools.build_meta"

[project]
name = "libstempo"
description = "A Python wrapper for tempo2"
authors = [{name = "Michele Vallisneri", email = "vallis@vallis.org"}]
urls = { Homepage = "https://github.com/vallis/libstempo" }
readme = "README.md"
license = {file = "LICENSE"} 
classifiers=[
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dynamic = [
    "version",
]

requires-python = ">=3.8, <4"
dependencies = [
    'numpy<2.0; python_version == "3.8"',
    'numpy; python_version > "3.8"',
    "scipy",
    "matplotlib",
    "ephem",
    "platformdirs",
]

[project.optional-dependencies]
astropy = [
    "astropy",
]
dev = [
    "black",
    "flake8",
    "Flake8-pyproject",
    "pre-commit",
    "wheel",
    "coverage",
    "pytest",
    "pytest-cov",
    "jupyter",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# TEMPO2_COPYING exists only in wheel builds, which bundle the GPL tempo2 library
libstempo = ["tempo2_runtime.json", "TEMPO2_COPYING"]

[tool.setuptools.exclude-package-data]
# needed to build the extension, not to run it
libstempo = ["*.pyx", "*.cpp", "*.h"]

[tool.setuptools.packages.find]
include = [
    "libstempo*",
]

[tool.setuptools_scm]
write_to = "libstempo/_version.py"

[tool.cibuildwheel]
# wheels bundle tempo2, built by install_tempo2.sh; the runtime data is downloaded on first use
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
build-verbosity = 1
# matplotlib, astropy and pyerfa publish no musllinux aarch64 wheels, so pip cannot install
# libstempo's dependencies there without compiling them
skip = ["*-musllinux_aarch64"]
test-extras = ["astropy"]
test-requires = ["pytest"]
# fetch only the files every run needs, so the tests also exercise the on-demand ephemeris download
test-command = "python -m libstempo.fetch_runtime && pytest -q {project}/tests"

[tool.cibuildwheel.linux]
before-all = [
    "yum install -y autoconf automake libtool gcc-gfortran",
    "bash install_tempo2.sh /opt/tempo2",
    "cp /opt/tempo2/share/doc/tempo2/COPYING libstempo/TEMPO2_COPYING",
]
environment = { TEMPO2_PREFIX = "/opt/tempo2" }
repair-wheel-command = "LD_LIBRARY_PATH=/opt/tempo2/lib auditwheel repair --strip -w {dest_dir} {wheel}"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = [
    "apk add autoconf automake libtool gfortran bash curl",
    "bash install_tempo2.sh /opt/tempo2",
    "cp /opt/tempo2/share/doc/tempo2/COPYING libstempo/TEMPO2_COPYING",
]

[tool.cibuildwheel.macos]
# tempo2 needs a long double wider than 64 bits, which arm64 macOS does not have
archs = ["x86_64"]
before-all = [
    "brew install automake libtool gcc",
    "sudo ln -sf \"$(brew --prefix gcc)/bin/gfortran-$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)\" /usr/local/bin/gfortran",
    "./install_tempo2.sh $HOME/tempo2",
    "cp $HOME/tempo2/share/doc/tempo2/COPYING libstempo/TEMPO2_COPYING",
]
# Homebrew's libgfortran targets the runner's macOS version
environment = { TEMPO2_PREFIX = "$HOME/tempo2", MACOSX_DEPLOYMENT_TARGET = "15.0" }
repair-wheel-command = "DYLD_LIBRARY_PATH=$HOME/tempo2/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.black]
line-length = 120
target_version = ['py39']
include = '\\.pyi?$'
exclude = '''
(
  /(
      \\.eggs         # exclude a few common directories in the
    | \\.git          # root of the project
    | \\.hg
    | \\.mypy_cache
    | \\.tox
    | _build
    | buck-out
    | build
    | dist
    | docs
    | .libstempo
    | libstempo/_version\.py
  )/
)
'''

[tool.flake8]
max-line-length = 120
max-complexity = 45
ignore = [
    "E203",
    "W503",      # line break before binary operator; conflicts with black
    "E722",      # bare except ok
    "E731",      # lambda expressions ok
    "E741",      # undescriptive variable ok
]
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "docs",
    ".libstempo",
]
