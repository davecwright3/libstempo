# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: libstempo CI tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types:
      - published


jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          # setup-python has no Python 3.9 for ubuntu-latest (26.04)
          - os: ubuntu-24.04
            python-version: '3.9'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tempo2 on mac
      if: runner.os == 'macOS'
      run: |
        brew install automake libtool gcc
        sudo ln -sf "$(brew --prefix gcc)/bin/gfortran-$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)" /usr/local/bin/gfortran
        gfortran --version
        ./install_tempo2.sh
        echo "TEMPO2_PREFIX=$HOME/.local" >> "$GITHUB_ENV"
        echo "--- tempo2 install verification ---"
        ls -la "$HOME/.local/include/" || echo "WARNING: $HOME/.local/include/ does not exist"
        ls -la "$HOME/.local/lib/"     || echo "WARNING: $HOME/.local/lib/ does not exist"
        test -f "$HOME/.local/include/tempo2.h" || { echo "FATAL: tempo2.h not found at $HOME/.local/include/tempo2.h"; exit 1; }
    - name: Install tempo2 on linux
      if: runner.os == 'Linux'
      run: |
        ./install_tempo2.sh
        echo "TEMPO2_PREFIX=$HOME/.local" >> "$GITHUB_ENV"
        test -f "$HOME/.local/include/tempo2.h" || { echo "FATAL: tempo2.h not found at $HOME/.local/include/tempo2.h"; exit 1; }
    - name: Install dependencies and package
      run: |
        python -m pip install --upgrade pip
        pip install -e .[astropy,dev]
    - name: Run lint
      run: make lint
    - name: Test with pytest
      run: make test


  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # no macOS arm64: tempo2 needs a long double wider than 64 bits
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build and test wheels
      uses: pypa/cibuildwheel@v4.3.5
    - name: Check wheel contents
      run: python3 tools/check_wheel.py wheelhouse/*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl


  wheel-offline:
    name: Wheel tests without network
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-latest
        path: wheelhouse
    - name: Fill the runtime cache, then test with networking disabled
      run: tools/test_wheel_offline.sh wheelhouse/*-cp312-cp312-manylinux*x86_64*.whl


  wheel-vs-source:
    name: Wheel results equal source-build results
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-latest
        path: wheelhouse
    - name: Install tempo2 from source
      run: |
        ./install_tempo2.sh
        echo "TEMPO2_PREFIX=$HOME/.local" >> "$GITHUB_ENV"
    - name: Compare residuals
      # both installs read the same runtime data, so any difference comes from the compiled code
      run: |
        export TEMPO2=$HOME/.local/share/tempo2
        python -m venv venv-source && venv-source/bin/pip install -q .
        python -m venv venv-wheel && venv-wheel/bin/pip install -q wheelhouse/*-cp312-cp312-manylinux*x86_64*.whl
        mkdir cmp && cd cmp
        ../venv-source/bin/python ../tools/compare_residuals.py dump source.json
        ../venv-wheel/bin/python ../tools/compare_residuals.py dump wheel.json
        python ../tools/compare_residuals.py compare source.json wheel.json --tol-ns 1


  build:
    needs: [tests]
    name: Build source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install tempo2
      run: |
        ./install_tempo2.sh
        echo "TEMPO2_PREFIX=$HOME/.local" >> "$GITHUB_ENV"
    - name: Build
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        python -m build --sdist --outdir dist
        make dist
    - name: Test the sdist
      run: |
        mkdir tmp
        cd tmp
        python -m venv venv-sdist
        venv-sdist/bin/python -m pip install --upgrade pip setuptools
        venv-sdist/bin/python -m pip install ../dist/libstempo*.tar.gz
        venv-sdist/bin/python -c "import libstempo;print(libstempo.__version__)"
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*


  deploy:
    needs: [tests, build, wheels, wheel-offline, wheel-vs-source]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    - name: Download the sdist and wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload dist/*
